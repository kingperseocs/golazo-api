name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golazo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d golazo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/golazo_test?sslmode=disable

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Revisar el formato
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Estos archivos no tienen el formato de gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Tests unitarios
        run: go test ./... -race -count=1

      - name: Instalar golang-migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Aplicar migraciones
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Tests de integración
        run: go test -tags=integration -race -count=1 ./internal/repository/...